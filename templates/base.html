<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Project Portal{% endblock %}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 18px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .content {
            padding: 30px;
        }

        .logout-form {
            display: inline;
            margin: 0;
        }

        .logout-button {
            background: none;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            padding: 0;
        }

        .logout-button:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="brand">
            Project Portal
        </div>

        <div class="nav-links">
            {% if request.user.is_authenticated %}
                <a href="{% url 'accounts:dashboard' %}">Dashboard</a>
                <a href="{% url 'projects:project_list' %}">Projects</a>

                <form class="logout-form" method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button class="logout-button" type="submit">Logout</button>
                </form>
            {% endif %}
        </div>
    </div>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
