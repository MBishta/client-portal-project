<!DOCTYPE html>
<html>
<head>
    <title>Project Portal Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 26px;
        }

        .login-box p {
            margin-bottom: 15px;
        }

        .login-box label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        .login-box button {
            width: 100%;
            padding: 10px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .error-box {
            background: #ffe6e6;
            color: #b00020;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>Project Portal Login</h1>

        {% if form.errors %}
            <div class="error-box">
                Invalid username or password.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Login</button>
        </form>
    </div>

</body>
</html>
